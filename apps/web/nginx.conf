# nginx: sirve la SPA (build de Vite) y hace de reverse proxy de la API.
# Un solo origen: el navegador solo ve este servidor; /api es interno.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Compresión de estáticos.
  gzip on;
  gzip_comp_level 6;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

  # Cabeceras de seguridad. OJO: nginx NO acumula add_header entre niveles;
  # un `location` con su propio add_header pierde estos. Por eso se repiten
  # en cada location que fija Cache-Control (se comprobó que faltaban).
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # API detrás del proxy: /api/xxx -> http://api:3001/xxx (se elimina el prefijo).
  location /api/ {
    # nginx resuelve el upstream UNA vez al arrancar si se pone el nombre
    # directamente en proxy_pass: si el contenedor de la API se recrea y cambia
    # de IP, se queda sirviendo 502 hasta recargarlo a mano (comprobado).
    # Con el resolver de Docker y la URL en una variable, vuelve a resolver.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $upstream_api http://api:3001;
    # Con variable en proxy_pass hay que quitar el prefijo /api explícitamente.
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $upstream_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 12m;  # permite subir nóminas PDF
  }

  # Cache larga para los assets con hash; la SPA cae siempre a index.html.
  location /assets/ {
    # Nombres con hash: se pueden cachear indefinidamente (una sola cabecera).
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri =404;
  }

  # index.html y el service worker NO deben cachearse: llevan la referencia a
  # los assets con hash, así que si el navegador los cachea el usuario se queda
  # con la versión anterior tras un redespliegue (comprobado).
  location = /sw.js {
    add_header Cache-Control "no-cache, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri $uri/ /index.html;
  }
}
