# Despliegue "como en producción": Postgres + API compilada + nginx (SPA + proxy).
# Un solo origen expuesto: http://localhost:8080
#
#
# Los secretos NO viven aquí: se leen de .env.prod, fuera del control de versiones.
# Genéralo con  scripts/preparar-produccion.sh  y arranca con:
#   docker compose --env-file .env.prod -f docker-compose.prod.yml up -d

# Proyecto propio para que NO colisione con el entorno de desarrollo
# (docker-compose.yml), que usa el mismo nombre de servicio `db`.
name: rrhh-prod

x-secrets: &secrets
  DATABASE_URL_OWNER: postgres://rrhh_owner:${DB_OWNER_PWD}@db:5432/rrhh
  DATABASE_URL_APP: postgres://rrhh_app:${DB_APP_PWD}@db:5432/rrhh
  APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY}
  NODE_ENV: production

services:
  db:
    image: postgres:16-alpine
    container_name: rrhh_db_prod
    environment:
      POSTGRES_USER: rrhh_owner
      POSTGRES_PASSWORD: ${DB_OWNER_PWD}
      POSTGRES_DB: rrhh
      TZ: Europe/Madrid
      PGTZ: Europe/Madrid
    volumes:
      - rrhh_pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rrhh_owner -d rrhh"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # Servicio de un solo uso: aplica migraciones y siembra datos de demo, y termina.
  init:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    environment: *secrets
    command: sh -c "node dist/db/migrate.js && node dist/seed/seed-ayuntamiento.js"
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    container_name: rrhh_api_prod
    environment:
      <<: *secrets
      PORT: "3001"
      # Rotula la interfaz como demostración. En una entidad real: sin definir
      # o "false"; ponlo a "true" solo para enseñar el producto.
      MODO_DEMO: "${MODO_DEMO:-false}"
    depends_on:
      db: { condition: service_healthy }
      init: { condition: service_completed_successfully }
    expose:
      - "3001"
    # Sonda real: comprueba la API y su acceso a la BD (node 22 trae fetch).
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/salud').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    container_name: rrhh_web_prod
    ports:
      - "${PUERTO_HTTP:-8080}:80"
      - "${PUERTO_HTTPS:-8443}:443"
    volumes:
      # Config seleccionable: nginx.conf (HTTP) o nginx-https.conf (TLS).
      - ./apps/web/${NGINX_CONF:-nginx.conf}:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  rrhh_pgdata_prod:
