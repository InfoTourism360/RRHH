# Variante con TLS. Se activa poniendo NGINX_CONF=nginx-https.conf en .env.prod
# y colocando el certificado en ./certs (scripts/preparar-produccion.sh los genera
# autofirmados para pruebas; en producción se sustituyen por los reales).
#
# Cifrado en tránsito: medida mp.com.2 del ENS.

# Todo el tráfico en claro se redirige a HTTPS.
#
# OJO: la redirección no lleva puerto, así que apunta al 443 estándar. Eso es lo
# correcto en un despliegue real (el contenedor se publica en 80 y 443). En la
# demo local, publicada en 8080/8443, la redirección NO llega a buen puerto:
# abre directamente https://localhost:8443. Para que redirija bien en local,
# pon PUERTO_HTTPS=443 en .env.prod.
server {
  listen 80;
  server_name _;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  ssl_certificate     /etc/nginx/certs/servidor.crt;
  ssl_certificate_key /etc/nginx/certs/servidor.key;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         HIGH:!aNULL:!MD5;
  ssl_prefer_server_ciphers off;
  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 10m;

  gzip on;
  gzip_comp_level 6;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  # Solo con TLS activo: obliga al navegador a no volver a HTTP.
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  location /api/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $upstream_api http://api:3001;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $upstream_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 12m;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    try_files $uri =404;
  }

  location = /sw.js {
    add_header Cache-Control "no-cache, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    try_files $uri $uri/ /index.html;
  }
}
